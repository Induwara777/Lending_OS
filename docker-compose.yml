# Local dev: decision-engine + its own PostgreSQL + RabbitMQ.
# In the full LendOS stack, the shared compose file provides the broker and database instead.
services:
  decision-engine:
    build: .
    ports: ["8000:8000"]
    environment:
      DECISION_DATABASE_URL: postgresql+psycopg://lendos:lendos@db:5432/lendos
      DECISION_RABBITMQ_URL: amqp://guest:guest@rabbitmq/
      DECISION_CLIENT_PACK_DIR: /srv/client_packs/demo
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  db:
    image: postgres:16
    environment: {POSTGRES_USER: lendos, POSTGRES_PASSWORD: lendos, POSTGRES_DB: lendos}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lendos"], interval: 5s, retries: 10}
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 10}
